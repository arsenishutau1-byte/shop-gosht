<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#efeafd">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<title>Ghost Shop</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --bg:#efeafd; --ink:#241b4b; --card:#fff; --hint:#6d6590; --accent:#5b3df5; --sun:#ffd43b; --shadow:0 4px 0 var(--ink); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  [hidden] { display:none !important; }
  html, body { margin:0; background:var(--bg); color:var(--ink); font-family:"Nunito", ui-rounded, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { padding:0 14px calc(104px + env(safe-area-inset-bottom,0px)); }
  header { display:flex; align-items:center; gap:10px; padding:16px 2px 10px; }
  h1 { margin:0; font-size:28px; font-weight:900; letter-spacing:-.02em; }
  .ghost { width:46px; height:52px; flex:none; animation:float 3.6s ease-in-out infinite; }
  @keyframes float { 50% { transform:translateY(-4px); } }
  @media (prefers-reduced-motion:reduce) { .ghost { animation:none; } }
  .top { position:sticky; top:0; z-index:5; background:var(--bg); padding:4px 0 2px; }
  .tabs { display:flex; gap:6px; padding-bottom:5px; }
  .tab { flex:1 1 auto; border:2px solid var(--ink); background:var(--card); color:var(--ink); font:inherit; font-weight:800; font-size:13px; padding:10px 4px; border-radius:14px; white-space:nowrap; cursor:pointer; box-shadow:var(--shadow); }
  .tab.on { background:var(--ink); color:#fff; }
  .tab:active, .add:active, .bar button:active { transform:translateY(3px); box-shadow:0 1px 0 var(--ink); }
  .badge { display:inline-block; min-width:22px; padding:0 6px; margin-left:6px; border-radius:999px; background:var(--sun); color:var(--ink); font-size:13px; line-height:20px; }
  .cats { display:flex; gap:8px; overflow-x:auto; padding:12px 2px; scrollbar-width:none; }
  .cats::-webkit-scrollbar { display:none; }
  .chip { flex:none; border:2px solid var(--ink); background:transparent; color:var(--ink); font:inherit; font-weight:700; font-size:14px; padding:6px 14px; border-radius:999px; cursor:pointer; }
  .chip.on { background:var(--accent); color:#fff; }
  .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:14px; padding:6px 0 4px; }
  @media (min-width:640px) { .grid { grid-template-columns:repeat(3,1fr); } }
  .card { background:var(--card); border:2px solid var(--ink); border-radius:22px; overflow:hidden; display:flex; flex-direction:column; box-shadow:var(--shadow); }
  .pic { position:relative; aspect-ratio:1/1; background:var(--tint,#e4defa); border-bottom:2px solid var(--ink); }
  .pic img, .thumb img { width:100%; height:100%; object-fit:contain; display:block; mix-blend-mode:multiply; }
  .pic .ph, .thumb .ph { width:100%; height:100%; display:grid; place-items:center; font-size:56px; }
  .info { padding:10px 12px 12px; display:flex; flex-direction:column; gap:3px; flex:1; }
  .name { font-size:15px; font-weight:800; line-height:1.2; }
  .desc { font-size:12px; color:var(--hint); font-weight:600; line-height:1.3; }
  .row { margin-top:auto; padding-top:10px; display:flex; align-items:center; justify-content:space-between; gap:6px; }
  .price { font-weight:900; font-size:16px; white-space:nowrap; }
  .add { border:2px solid var(--ink); background:var(--accent); color:#fff; font:inherit; font-weight:800; font-size:13px; padding:7px 12px; border-radius:12px; cursor:pointer; box-shadow:0 3px 0 var(--ink); }
  .qty { display:flex; align-items:center; gap:6px; }
  .qty button { width:30px; height:30px; padding:0; border:2px solid var(--ink); border-radius:10px; background:var(--sun); color:var(--ink); font-size:18px; font-weight:900; line-height:1; cursor:pointer; }
  .qty span { min-width:18px; text-align:center; font-weight:900; }
  .line { display:flex; align-items:center; gap:12px; background:var(--card); border:2px solid var(--ink); border-radius:18px; padding:10px; margin-bottom:12px; box-shadow:var(--shadow); }
  .thumb { width:64px; height:64px; flex:none; border-radius:12px; border:2px solid var(--ink); overflow:hidden; background:var(--tint,#e4defa); }
  .thumb .ph { font-size:28px; }
  .lname { flex:1; min-width:0; }
  .total { display:flex; justify-content:space-between; align-items:center; padding:14px 6px; font-size:20px; font-weight:900; }
  .empty { grid-column:1/-1; text-align:center; color:var(--hint); font-weight:700; padding:40px 0; }
  .form { background:var(--card); border:2px solid var(--ink); border-radius:18px; padding:14px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:12px; margin-bottom:8px; }
  .form h2 { margin:0; font-size:18px; font-weight:900; }
  .form label { display:flex; flex-direction:column; gap:5px; font-size:13px; font-weight:800; }
  .form input { width:100%; border:2px solid var(--ink); border-radius:12px; padding:12px; font:inherit; font-size:16px; font-weight:600; color:var(--ink); background:#fff; outline:none; }
  .form input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(91,61,245,.25); }
  .form input.bad { border-color:#e5384d; background:#fff1f3; }
  .pay { display:flex; align-items:center; gap:8px; background:var(--sun); border:2px solid var(--ink); border-radius:12px; padding:10px 12px; font-weight:800; font-size:14px; }
  .like { position:absolute; top:8px; right:8px; width:36px; height:36px; padding:0; border-radius:50%; border:2px solid var(--ink); background:#fff; display:grid; place-items:center; cursor:pointer; }
  .like svg { width:20px; height:20px; fill:none; stroke:var(--ink); stroke-width:2.2; stroke-linejoin:round; }
  .like.on { background:#ff4d79; }
  .like.on svg { fill:#fff; }
  .like:active { transform:scale(.9); }
  .note { margin:0; font-size:12.5px; color:var(--hint); font-weight:600; }
  .bar { position:fixed; left:14px; right:14px; bottom:calc(14px + env(safe-area-inset-bottom,0px)); display:none; }
  .bar.show.fallback { display:block; }
  .bar button { width:100%; border:2px solid var(--ink); padding:14px; border-radius:16px; background:var(--accent); color:#fff; font:inherit; font-weight:900; font-size:16px; cursor:pointer; box-shadow:var(--shadow); }
  .age { position:fixed; inset:0; z-index:50; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:24px; text-align:center; }
  .age .ghost { width:96px; height:108px; }
  .age h2 { margin:0; font-size:26px; font-weight:900; }
  .age p { margin:0; color:var(--hint); font-weight:600; max-width:300px; }
  .age button { border:2px solid var(--ink); background:var(--accent); color:#fff; font:inherit; font-weight:900; padding:13px 28px; border-radius:16px; cursor:pointer; margin-top:8px; box-shadow:var(--shadow); }
  button:focus-visible { outline:3px solid var(--sun); outline-offset:2px; }
</style>
</head>

const CURRENCY = "BYN";
// ===========================================================

const tg = window.Telegram && Telegram.WebApp;
const inTelegram = !!(tg && tg.initData);
if (tg) {
  tg.ready(); tg.expand();
  try { tg.setHeaderColor("#efeafd"); tg.setBackgroundColor("#efeafd"); } catch (e) {}
}

const cart = {};
const loadJSON = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const saveJSON = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const form = Object.assign({ first: "", last: "", phone: "", addr: "" }, loadJSON("gs_profile"));   // профиль покупателя
const favs = new Set(loadJSON("gs_favs") || []);                                                     // избранное
const esc = v => v.replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");            // id -> количество
let activeCat = "Все";
let view = "catalog";       // "catalog" | "favs" | "cart" | "profile"
const $ = id => document.getElementById(id);
const fmt = n => n.toLocaleString("ru-RU") + " " + CURRENCY;
// Категории: добавляйте новые сюда и в поле cat у товаров
const cats = ["Все", "Жидкость", "Расходники"];

function fmtPhone(v) {
  const raw = v.replace(/\D/g, "");
  let d = raw;
  if (d.startsWith("375")) d = d.slice(3);
  else if (v.includes("+") && "375".startsWith(d)) d = "";
  if (!d && raw !== "375") return "";
  d = d.slice(0, 9);
  let out = "+375";
  if (d.length) out += " (" + d.slice(0, 2);
  if (d.length >= 2) out += ")";
  if (d.length > 2) out += " " + d.slice(2, 5);
  if (d.length > 5) out += "-" + d.slice(5, 7);
  if (d.length > 7) out += "-" + d.slice(7, 9);
  return out;
}
const fieldsHTML = () => `
  <label>Имя<input data-f="first" autocomplete="given-name" placeholder="Например, Иван" value="${esc(form.first)}"></label>
  <label>Фамилия<input data-f="last" autocomplete="family-name" placeholder="Например, Иванов" value="${esc(form.last)}"></label>
  <label>Телефон<input data-f="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+375 (29) 123-45-67" value="${esc(form.phone)}"></label>
  <label>Адрес (метро)<input data-f="addr" autocomplete="street-address" placeholder="Улица, дом или станция метро" value="${esc(form.addr)}"></label>`;

function totals() {
  let count = 0, sum = 0;
  for (const p of PRODUCTS) { const q = cart[p.id] || 0; count += q; sum += q * p.price; }
  return { count, sum };
}
const pic = p => p.img ? `<img src="${p.img}" alt="${p.name}">` : `<span class="ph">${p.emoji || "📦"}</span>`;

function renderTabs() {
  const { count } = totals();
  const t = (v, label, extra = "") => `<button class="tab ${view === v ? "on" : ""}" data-view="${v}">${label}${extra}</button>`;
  $("tabs").innerHTML = t("catalog", "Каталог") + t("favs", "Избранное") +
    t("cart", "Корзина", count ? `<span class="badge">${count}</span>` : "") + t("profile", "Профиль");
}

function renderCats() {
  $("cats").hidden = view !== "catalog";
  $("cats").innerHTML = cats.map(c =>
    `<button class="chip ${c === activeCat ? "on" : ""}" data-cat="${c}">${c}</button>`).join("");
}

function qtyControls(p) {
  const q = cart[p.id] || 0;
  return q
    ? `<div class="qty"><button data-act="dec" data-id="${p.id}" aria-label="Убрать">−</button><span>${q}</span><button data-act="inc" data-id="${p.id}" aria-label="Добавить">+</button></div>`
    : `<button class="add" data-act="inc" data-id="${p.id}">В корзину</button>`;
}

const HEART = '<svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>';
const cardHTML = p => {
  const fav = favs.has(p.id);
  return `<article class="card">
      <div class="pic" style="--tint:${p.tint || "#e4defa"}">${pic(p)}
        <button class="like ${fav ? "on" : ""}" data-like="${p.id}" aria-pressed="${fav}" aria-label="В избранное">${HEART}</button></div>
      <div class="info"><div class="name">${p.name}</div><div class="desc">${p.desc}</div>
      <div class="row"><span class="price">${fmt(p.price)}</span>${qtyControls(p)}</div></div></article>`;
};

function renderGrid() {
  const show = view === "catalog" || view === "favs";
  $("grid").hidden = !show;
  if (!show) return;
  const list = view === "favs" ? PRODUCTS.filter(p => favs.has(p.id))
                               : PRODUCTS.filter(p => activeCat === "Все" || p.cat === activeCat);
  $("grid").innerHTML = list.length ? list.map(cardHTML).join("")
    : view === "favs"
      ? `<div class="empty">Здесь будут любимые товары.<br>Нажмите на сердечко у товара.<br><button class="add" data-view="catalog" style="margin-top:14px">В каталог</button></div>`
      : `<div class="empty">Скоро здесь появятся товары</div>`;
}

function renderProfile() {
  $("profileView").hidden = view !== "profile";
  if (view !== "profile") return;
  $("profileView").innerHTML = `<div class="form"><h2>Мой профиль</h2>${fieldsHTML()}
    <p class="note">Данные сохраняются на этом устройстве и подставляются при оформлении заказа.</p></div>`;
}

function renderCart() {
  $("cartView").hidden = view !== "cart";
  if (view !== "cart") return;
  const items = PRODUCTS.filter(p => cart[p.id]);
  if (!items.length) {
    $("cartView").innerHTML = `<div class="empty">Корзина пуста<br><button class="add" data-view="catalog" style="margin-top:14px">Перейти в каталог</button></div>`;
    return;
  }
  $("cartView").innerHTML = items.map(p => `<div class="line">
      <div class="thumb" style="--tint:${p.tint || "#e4defa"}">${pic(p)}</div>
      <div class="lname"><div class="name">${p.name}</div><div class="desc">${fmt(p.price)} × ${cart[p.id]} = ${fmt(p.price * cart[p.id])}</div></div>
      ${qtyControls(p)}</div>`).join("") +
    `<div class="total"><span>Итого</span><b>${fmt(totals().sum)}</b></div>` +
    `<div class="form">
      <h2>Данные для заказа</h2>
      ${fieldsHTML()}
      <div class="pay">💵 Оплата наличными при получении</div>
    </div>`;
}

function renderCheckout() {
  const { count, sum } = totals();
  const label = view === "cart" ? `Оформить заказ · ${fmt(sum)}` : `Корзина · ${fmt(sum)}`;
  if (inTelegram) {
    if (count) { tg.MainButton.setText(label); tg.MainButton.show(); }
    else tg.MainButton.hide();
  } else {
    // Запасной вариант для открытия в обычном браузере
    $("bar").className = "bar fallback" + (count ? " show" : "");
    $("barBtn").textContent = label;
  }
}

function renderAll() { renderTabs(); renderCats(); renderGrid(); renderCart(); renderProfile(); renderCheckout(); }
function setView(v) { view = v; renderAll(); window.scrollTo(0, 0); }

function checkout() {
  const missing = ["first", "last", "phone", "addr"].filter(k =>
    k === "phone" ? form.phone.replace(/\D/g, "").length !== 12 : !form[k].trim());
  if (missing.length) {
    missing.forEach(k => document.querySelector(`[data-f="${k}"]`).classList.add("bad"));
    document.querySelector(`[data-f="${missing[0]}"]`).scrollIntoView({ block: "center", behavior: "smooth" });
    const msg = "Заполните имя, фамилию, телефон (+375) и адрес (метро)";
    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("error");
    if (inTelegram && tg.showAlert) tg.showAlert(msg); else alert(msg);
    return;
  }
  const items = PRODUCTS.filter(p => cart[p.id]).map(p => ({ id: p.id, name: p.name, qty: cart[p.id], price: p.price }));
  const order = {
    customer: { first_name: form.first.trim(), last_name: form.last.trim(), phone: form.phone, address: form.addr.trim() },
    payment: "cash",
    items, total: totals().sum, currency: CURRENCY
  };
  if (inTelegram) tg.sendData(JSON.stringify(order));   // уходит боту, мини-апп закроется
  else alert("Заказ (тест в браузере):\n" + JSON.stringify(order, null, 2));
}
function mainAction() { view === "cart" ? checkout() : setView("cart"); }

document.addEventListener("click", e => {
  const l = e.target.closest("[data-like]");
  if (l) {
    const id = +l.dataset.like;
    favs.has(id) ? favs.delete(id) : favs.add(id);
    saveJSON("gs_favs", [...favs]);
    if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred("light");
    renderGrid();
    return;
  }
  const v = e.target.closest("[data-view]");
  if (v) { setView(v.dataset.view); return; }
  const c = e.target.closest("[data-cat]");
  if (c) { activeCat = c.dataset.cat; renderCats(); renderGrid(); return; }
  const b = e.target.closest("[data-act]");
  if (b) {
    const id = +b.dataset.id;
    cart[id] = Math.max(0, (cart[id] || 0) + (b.dataset.act === "inc" ? 1 : -1));
    if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
    renderAll();
  }
});
document.addEventListener("input", e => {
  const k = e.target.dataset && e.target.dataset.f;
  if (k) {
    if (k === "phone") e.target.value = fmtPhone(e.target.value);
    form[k] = e.target.value;
    e.target.classList.remove("bad");
    saveJSON("gs_profile", form);
  }
});
$("barBtn").addEventListener("click", mainAction);
if (inTelegram) tg.MainButton.onClick(mainAction);

// Подтверждение возраста (запоминается на устройстве)
try { if (localStorage.getItem("age18") !== "1") $("age").hidden = false; } catch (e) { $("age").hidden = false; }
$("ageYes").addEventListener("click", () => {
  try { localStorage.setItem("age18", "1"); } catch (e) {}
  $("age").hidden = true;
});

renderAll();
</script>
</body>
</html>
